# Start everything:  docker compose up -d
# Settings live in .env.docker (app + database credentials).

name: manufacturing

services:
  app:
    build:
      context: .
      target: app
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    image: manufacturing-app
    restart: unless-stopped
    env_file: .env.docker
    depends_on:
      db:
        condition: service_healthy

  nginx:
    build:
      context: .
      target: nginx
      args:
        PHP_VERSION: ${PHP_VERSION:-8.5}
    image: manufacturing-nginx
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    depends_on:
      - app

  db:
    image: ${DOCKER_DB_IMAGE:-mariadb:10.11}
    restart: unless-stopped
    env_file: .env.docker
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/db/dataset.sql:/docker-entrypoint-initdb.d/01-dataset.sql:ro
    ports:
      - "${DB_FORWARD_PORT:-3307}:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

volumes:
  db_data:
